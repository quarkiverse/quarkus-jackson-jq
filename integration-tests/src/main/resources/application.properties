quarkus.jackson.jq.functions.version=1.8.2
quarkus.jackson.jq.functions.excludes=min_by,@text,uuid3,now

# Configures the 'time' module to be registered in the Environment with the path "jackson-jq/time-example-path".
# Expressions that want to use it, must either explicitly "import" or "include" it by using this path.
quarkus.jackson.jq.modules.time.path=jackson-jq/time-example-path

# Configures the 'uri' module to be imported in the Environment with the alias "urialias".
# Expressions that want to use it, can refer the module functions directly by using the alias, e.g, urialias::func(...)
# and by not having to explicitly "import" the module.
# and by not having to explicitly "import" the module.
# note: values like "uri-example-alias" are not welcome.
quarkus.jackson.jq.modules.uri.strategy=import
quarkus.jackson.jq.modules.uri.alias=uriexamplealias

# Configures the 'random' module to be included in the Environment.
# Expressions that want to use it, can refer the module functions directly by the corresponding name, e.g.  myfunc(...)
quarkus.jackson.jq.modules.random.strategy=include

